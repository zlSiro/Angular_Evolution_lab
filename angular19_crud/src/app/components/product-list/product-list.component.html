<div class="rounded-lg bg-slate-800 p-6 text-white shadow-lg">

  <h2 class="mb-4 text-xl font-bold">
    Productos
  </h2>

  <div class="space-y-3">

    <!-- Iterar sobre la lista de productos y mostrar cada uno usando el @for() -->
    @for (product of products(); track product.id) {

      <div class="flex items-center justify-between rounded-lg bg-slate-700 p-4">

        <div>
          <p class="font-semibold">
            {{ product.name }}
          </p>

          <p class="text-sm text-slate-300">
            ID: {{ product.id }}
          </p>
        </div>

        <p class="font-bold">
          ${{ product.price }}
        </p>

      </div>

    }

  </div>

</div>
